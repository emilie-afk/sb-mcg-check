<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plant Tracker — MCG vs Succulents Box</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f2;
      color: #1a1a1a;
      min-height: 100vh;
    }

    /* ── Gate ── */
    #gate {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }
    .gate-card {
      background: #fff;
      border: 1px solid #e0e0d8;
      border-radius: 12px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 360px;
      text-align: center;
    }
    .gate-card h1 { font-size: 20px; font-weight: 600; margin-bottom: 6px; }
    .gate-card p  { font-size: 14px; color: #666; margin-bottom: 1.5rem; }
    .gate-card input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #d0d0c8;
      border-radius: 8px;
      font-size: 15px;
      margin-bottom: 12px;
      outline: none;
      transition: border-color .15s;
    }
    .gate-card input:focus { border-color: #2E7D32; }
    .btn-primary {
      width: 100%;
      padding: 10px;
      background: #2E7D32;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: background .15s;
    }
    .btn-primary:hover  { background: #256127; }
    .btn-primary:active { background: #1b4a1e; }
    .gate-error { color: #c62828; font-size: 13px; margin-top: 10px; display: none; }

    /* ── App ── */
    #app { display: none; max-width: 820px; margin: 0 auto; padding: 2rem 1.5rem; }

    .app-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 1.5rem;
    }
    .app-header h1 { font-size: 20px; font-weight: 600; }
    .app-header .meta { font-size: 13px; color: #888; }

    /* Summary cards */
    .summary {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 1.5rem;
    }
    .stat-card {
      background: #fff;
      border: 1px solid #e0e0d8;
      border-radius: 10px;
      padding: 1rem 1.25rem;
    }
    .stat-card .num  { font-size: 32px; font-weight: 600; color: #1a1a1a; }
    .stat-card .lbl  { font-size: 13px; color: #666; margin-top: 2px; }
    .stat-card.green .num { color: #2E7D32; }
    .stat-card.amber .num { color: #8B5E00; }

    /* Controls */
    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }
    .controls input {
      flex: 1;
      min-width: 200px;
      padding: 9px 12px;
      border: 1px solid #d0d0c8;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      background: #fff;
      transition: border-color .15s;
    }
    .controls input:focus { border-color: #2E7D32; }
    .btn-refresh {
      padding: 9px 16px;
      border: 1px solid #d0d0c8;
      border-radius: 8px;
      background: #fff;
      font-size: 14px;
      cursor: pointer;
      color: #444;
      transition: background .15s;
      white-space: nowrap;
    }
    .btn-refresh:hover { background: #f0f0ec; }
    .btn-refresh:disabled { opacity: .5; cursor: not-allowed; }

    /* Tabs */
    .tab-bar {
      display: flex;
      border-bottom: 1px solid #e0e0d8;
      margin-bottom: 1rem;
    }
    .tab {
      padding: 9px 18px;
      font-size: 14px;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      color: #888;
      transition: all .15s;
      margin-bottom: -1px;
    }
    .tab.active { color: #1a1a1a; border-bottom-color: #2E7D32; font-weight: 500; }

    /* Plant list */
    .plant-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .plant-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      background: #fff;
      border: 1px solid #e8e8e0;
      border-radius: 8px;
      font-size: 14px;
    }
    .plant-row:nth-child(even) { background: #fafaf7; }
    .badge {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 6px;
      white-space: nowrap;
      flex-shrink: 0;
      font-weight: 500;
    }
    .badge-green { background: #EAF3DE; color: #3B6D11; }
    .badge-amber { background: #FAEEDA; color: #7A4B00; }
    .plant-name  { flex: 1; }
    .genus-tag   { font-size: 12px; color: #aaa; flex-shrink: 0; }

    /* States */
    .state-box {
      text-align: center;
      padding: 3rem 2rem;
      color: #888;
      font-size: 14px;
    }
    .state-box .spinner {
      display: inline-block;
      width: 28px; height: 28px;
      border: 3px solid #e0e0d8;
      border-top-color: #2E7D32;
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin-bottom: 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .logout-btn {
      font-size: 13px;
      color: #888;
      background: none;
      border: none;
      cursor: pointer;
      text-decoration: underline;
      padding: 0;
    }
    .logout-btn:hover { color: #c62828; }
  </style>
</head>
<body>

<!-- Password gate -->
<div id="gate">
  <div class="gate-card">
    <h1>🌵 Plant Tracker</h1>
    <p>MCG vs Succulents Box — internal tool</p>
    <form id="gate-form" onsubmit="login(event)">
      <input type="password" id="pw-input" placeholder="Enter password" autocomplete="current-password" required>
      <button type="submit" class="btn-primary" id="login-btn">Sign in</button>
    </form>
    <div class="gate-error" id="gate-error">Incorrect password.</div>
  </div>
</div>

<!-- Main app -->
<div id="app">
  <div class="app-header">
    <h1>🌵 MCG vs Succulents Box</h1>
    <div style="display:flex;align-items:center;gap:12px">
      <span class="meta" id="updated-at"></span>
      <button class="logout-btn" onclick="logout()">Sign out</button>
    </div>
  </div>

  <div class="summary">
    <div class="stat-card green">
      <div class="num" id="cnt1">—</div>
      <div class="lbl">MCG in stock, not carried by SB</div>
    </div>
    <div class="stat-card amber">
      <div class="num" id="cnt2">—</div>
      <div class="lbl">MCG in stock, SB out of stock</div>
    </div>
  </div>

  <div class="controls">
    <input type="text" id="search" placeholder="Search plants…" oninput="render()">
    <button class="btn-refresh" id="refresh-btn" onclick="loadData(true)">↻ Refresh</button>
  </div>

  <div class="tab-bar">
    <button class="tab active" id="tab0" onclick="setTab(0)">Not in SB <span id="t1c"></span></button>
    <button class="tab"        id="tab1" onclick="setTab(1)">SB out of stock <span id="t2c"></span></button>
  </div>

  <div id="list-area">
    <div class="state-box">
      <div class="spinner"></div><br>Loading live data…
    </div>
  </div>
</div>

<script>
  const TOKEN_KEY = "plt_token";
  let activeTab = 0;
  let allData   = { mcgOnly: [], sbOos: [] };

  // ── Auth ──────────────────────────────────────────────────────────────────
  async function login(e) {
    e.preventDefault();
    const pw  = document.getElementById("pw-input").value;
    const btn = document.getElementById("login-btn");
    btn.disabled = true;
    btn.textContent = "Checking…";
    document.getElementById("gate-error").style.display = "none";

    try {
      const res  = await fetch("/.netlify/functions/auth", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: pw }),
      });
      const data = await res.json();
      if (data.ok && data.token) {
        sessionStorage.setItem(TOKEN_KEY, data.token);
        showApp();
      } else {
        document.getElementById("gate-error").style.display = "block";
      }
    } catch {
      document.getElementById("gate-error").textContent = "Connection error. Try again.";
      document.getElementById("gate-error").style.display = "block";
    } finally {
      btn.disabled = false;
      btn.textContent = "Sign in";
    }
  }

  function logout() {
    sessionStorage.removeItem(TOKEN_KEY);
    document.getElementById("app").style.display  = "none";
    document.getElementById("gate").style.display = "flex";
    document.getElementById("pw-input").value = "";
  }

  function showApp() {
    document.getElementById("gate").style.display = "none";
    document.getElementById("app").style.display  = "block";
    loadData(false);
  }

  // ── Data loading ──────────────────────────────────────────────────────────
  async function loadData(forceRefresh) {
    const token = sessionStorage.getItem(TOKEN_KEY);
    if (!token) { logout(); return; }

    const btn = document.getElementById("refresh-btn");
    btn.disabled = true;
    btn.textContent = "↻ Loading…";
    setListHTML(`<div class="state-box"><div class="spinner"></div><br>${forceRefresh ? "Re-scraping both sites…" : "Loading live data…"}<br><small style="color:#aaa;margin-top:6px;display:block">This can take up to 20 seconds on first load.</small></div>`);

    try {
      const url = "/.netlify/functions/scrape" + (forceRefresh ? "?refresh=true" : "");
      const res = await fetch(url, {
        headers: { Authorization: "Bearer " + token },
      });

      if (res.status === 401) { logout(); return; }
      if (!res.ok) throw new Error("Server error " + res.status);

      const data = await res.json();
      allData = data;

      // Update counts
      document.getElementById("cnt1").textContent = data.mcgOnly.length;
      document.getElementById("cnt2").textContent = data.sbOos.length;

      // Updated-at label
      if (data.cachedAt) {
        const ago = timeSince(data.cachedAt);
        document.getElementById("updated-at").textContent =
          (data.fromCache ? "Cached " : "Updated ") + ago;
      }

      render();
    } catch (err) {
      setListHTML(`<div class="state-box" style="color:#c62828">Failed to load data.<br><small>${err.message}</small></div>`);
    } finally {
      btn.disabled = false;
      btn.textContent = "↻ Refresh";
    }
  }

  // ── Rendering ─────────────────────────────────────────────────────────────
  function setTab(i) {
    activeTab = i;
    document.getElementById("tab0").classList.toggle("active", i === 0);
    document.getElementById("tab1").classList.toggle("active", i === 1);
    render();
  }

  function render() {
    const q    = document.getElementById("search").value.toLowerCase();
    const list = activeTab === 0 ? allData.mcgOnly : allData.sbOos;
    const rows = list.filter(n => n.toLowerCase().includes(q));

    // Update tab counts with filter
    const f0 = allData.mcgOnly.filter(n => n.toLowerCase().includes(q)).length;
    const f1 = allData.sbOos.filter(n  => n.toLowerCase().includes(q)).length;
    document.getElementById("t1c").textContent = `(${f0})`;
    document.getElementById("t2c").textContent = `(${f1})`;

    if (!rows.length) {
      setListHTML(`<div class="state-box">No plants match "<strong>${escHtml(q)}</strong>".</div>`);
      return;
    }

    const badge = activeTab === 0
      ? `<span class="badge badge-green">MCG only</span>`
      : `<span class="badge badge-amber">SB out of stock</span>`;

    setListHTML(
      `<div class="plant-list">` +
      rows.map(name => {
        const genus = name.split(/[\s'"]/)[0];
        return `<div class="plant-row">${badge}<span class="plant-name">${escHtml(name)}</span><span class="genus-tag">${escHtml(genus)}</span></div>`;
      }).join("") +
      `</div>`
    );
  }

  function setListHTML(html) {
    document.getElementById("list-area").innerHTML = html;
  }

  function escHtml(s) {
    return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  function timeSince(ts) {
    const mins = Math.floor((Date.now() - ts) / 60000);
    if (mins < 1)  return "just now";
    if (mins < 60) return `${mins}m ago`;
    const hrs = Math.floor(mins / 60);
    return `${hrs}h ago`;
  }

  // ── Init: restore session if token still valid ────────────────────────────
  (function init() {
    const token = sessionStorage.getItem(TOKEN_KEY);
    if (token) showApp();
  })();
</script>
</body>
</html>
